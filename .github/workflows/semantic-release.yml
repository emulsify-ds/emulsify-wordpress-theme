name: WordPress Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: composer:v2, wp-cli
          coverage: none

      - name: Clean npm install
        run: npm ci --ignore-scripts

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --strict

      - name: Run PHP lint
        run: npm run lint:php

      - name: Run runtime npm audit
        run: npm audit --omit=dev

      - name: Check release config syntax
        run: node --check release.config.js

      - name: Run release readiness checks
        env:
          WP_SMOKE_REQUIRED: '1'
          WP_SMOKE_DB_HOST: 127.0.0.1
          WP_SMOKE_DB_PORT: '3306'
          WP_SMOKE_DB_NAME: wordpress_smoke
          WP_SMOKE_DB_USER: root
          WP_SMOKE_DB_PASSWORD: root
        run: npm run release:check

      - name: Run release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish-test -- --no-ci

      - name: Run full npm audit
        run: npm audit

  semantic-release:
    name: Semantic release
    needs: release-readiness
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Clean npm install
        run: npm ci --ignore-scripts

      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
